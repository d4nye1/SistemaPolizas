<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Información de Pólizas | Sistema de Pólizas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-4xl bg-white/95 rounded-2xl shadow-2xl p-8 space-y-6">

  <!-- CABECERA -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Información de Pólizas</h1>
      <p class="text-sm text-slate-500">Consulta, búsqueda y registro de pólizas</p>
    </div>
    <button onclick="window.location.href='index.html'"
      class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-900 transition">
      Menú principal
    </button>
  </div>

  <!-- BÚSQUEDA -->
  <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 space-y-4">
    <h3 class="text-lg font-semibold text-slate-700 mb-2">Búsqueda de pólizas</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <input id="curpCliente" placeholder="CURP del cliente"
        class="rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
      <input id="nombreCliente" placeholder="Nombre completo del cliente"
        class="rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
      <input id="nombreBeneficiario" placeholder="Nombre completo del beneficiario"
        class="rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
      <input id="clavePoliza" placeholder="Clave de póliza"
        class="rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
      <input id="tipoPoliza" placeholder="Tipo de póliza (Automóvil, Vida, Médico)"
        class="rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
      <input id="fechaNacimiento" type="date"
        class="rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
    </div>

    <div class="flex gap-4 mt-4">
      <button onclick="buscar()"
        class="flex-1 px-6 py-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold transition">
        Buscar
      </button>
      <button onclick="todas()"
        class="flex-1 px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold transition">
        Todas las pólizas
      </button>
    </div>
  </div>

  <!-- REGISTRO NUEVA PÓLIZA -->
  <div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
    <button onclick="window.location.href='poliza.html'"
      class="w-full px-6 py-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold transition">
      Registrar nueva póliza
    </button>
  </div>

  <!-- RESULTADOS -->
  <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 overflow-x-auto">
    <h3 class="text-lg font-semibold text-slate-700 mb-4">Resultados</h3>
    <table class="min-w-full border border-slate-300 rounded-xl overflow-hidden">
      <thead class="bg-slate-200">
        <tr>
          <th class="p-3 text-left border border-slate-300">Clave</th>
          <th class="p-3 text-left border border-slate-300">Tipo</th>
          <th class="p-3 text-left border border-slate-300">Monto</th>
          <th class="p-3 text-left border border-slate-300">Descripción</th>
          <th class="p-3 text-left border border-slate-300">CURP Cliente</th>
        </tr>
      </thead>
      <tbody id="tablaPolizas" class="text-sm"></tbody>
    </table>
  </div>

</div>

<script>
const base = "/api/polizas";

// ✅ FUNCIÓN MEJORADA: ACEPTA LISTA O OBJETO INDIVIDUAL
function renderTabla(data){
  const tabla = document.getElementById("tablaPolizas");
  tabla.innerHTML = "";

  if (!data) {
    tabla.innerHTML = `<tr><td colspan="5" class="p-3 text-center">No se encontraron pólizas</td></tr>`;
    return;
  }

  const lista = Array.isArray(data) ? data : [data];

  if (lista.length === 0) {
    tabla.innerHTML = `<tr><td colspan="5" class="p-3 text-center">No se encontraron pólizas</td></tr>`;
    return;
  }

  lista.forEach(p => {
    tabla.innerHTML += `
      <tr class="hover:bg-slate-100 transition">
        <td class="p-2 border border-slate-300">${p.clave || ''}</td>
        <td class="p-2 border border-slate-300">${p.tipo || ''}</td>
        <td class="p-2 border border-slate-300">${p.monto || ''}</td>
        <td class="p-2 border border-slate-300">${p.descripcion || ''}</td>
        <td class="p-2 border border-slate-300">${p.cliente ? p.cliente.curp : ''}</td>
      </tr>
    `;
  });
}

// ================= BUSCAR =================
function buscar(){
  const curp = document.getElementById("curpCliente").value.trim();
  const cliente = document.getElementById("nombreCliente").value.trim();
  const beneficiario = document.getElementById("nombreBeneficiario").value.trim();

  const params = new URLSearchParams();
  if (curp) params.append("curp", curp);
  if (cliente) params.append("cliente", cliente);
  if (beneficiario) params.append("beneficiario", beneficiario);

  const url = base + "/buscar?" + params.toString();

  fetch(url)
    .then(r => r.json())
    .then(data => renderTabla(data))
    .catch(err => {
      console.error("Error:", err);
      renderTabla([]);
    });
}

// ================= TODAS =================
function todas(){
  fetch(base)
    .then(r => r.json())
    .then(data => renderTabla(data))
    .catch(err => {
      console.error("Error:", err);
      renderTabla([]);
    });
}
</script>

</body>
</html>
