<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Gestión de Beneficiarios | Sistema de Pólizas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-3xl bg-white/95 rounded-2xl shadow-2xl p-8">

  <!-- CABECERA -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Gestión de Beneficiarios</h1>
      <p class="text-sm text-slate-500">Crear, editar y consultar beneficiarios</p>
    </div>
    <button onclick="window.location.href='index.html'"
      class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-900 transition">
      Menú principal
    </button>
  </div>

  <!-- FORMULARIO BENEFICIARIO -->
  <div class="space-y-6">

    <div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
      <h3 class="text-lg font-semibold text-slate-700 mb-4">Crear / Editar Beneficiario</h3>
      <input type="hidden" id="beneficiarioId">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Nombres</label>
          <input id="nombres" placeholder="Nombre(s)"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Primer apellido</label>
          <input id="primerApellido" placeholder="Apellido paterno"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Segundo apellido</label>
          <input id="segundoApellido" placeholder="Opcional"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Fecha de nacimiento</label>
          <input type="date" id="fechaNacimiento"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Porcentaje de beneficio</label>
          <input type="number" id="porcentaje" placeholder="%" step="0.01"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Clave de póliza asociada</label>
          <input type="number" id="clavePoliza" placeholder="Clave de póliza"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
        </div>
      </div>

      <div class="flex justify-between items-center mt-6">
        <button onclick="crear()"
          class="px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold shadow transition">
          Crear
        </button>

        <button onclick="editar()"
          class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-semibold shadow transition">
          Editar
        </button>
      </div>
    </div>

    <!-- BUSQUEDA -->
    <div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
      <h3 class="text-lg font-semibold text-slate-700 mb-4">Buscar Beneficiario</h3>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
        <input id="buscarNombre" placeholder="Nombres"
          class="rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
        <input id="buscarApellido1" placeholder="Primer apellido"
          class="rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
        <input id="buscarApellido2" placeholder="Segundo apellido"
          class="rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none"/>
      </div>

      <div class="flex flex-col md:flex-row gap-4">
        <button onclick="buscarPorNombre()"
          class="px-6 py-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold transition flex-1">
          Buscar por Nombre
        </button>
        <button onclick="borrar()"
          class="px-6 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-semibold transition flex-1">
          Borrar
        </button>
      </div>
    </div>

    <!-- RESULTADO -->
    <div class="bg-slate-100 p-6 rounded-xl border border-slate-200">
      <h3 class="text-lg font-semibold text-slate-700 mb-2">Resultado</h3>
      <pre id="output" class="bg-white p-4 rounded-xl shadow-inner overflow-auto text-sm">
Aquí verás la respuesta...
      </pre>
    </div>

  </div>
</div>

<script>
const base = "/api/beneficiarios";

function mostrar(text){ document.getElementById('output').textContent = text; }

function obtenerDatos(){
  return {
    nombres: nombres.value,
    primerApellido: primerApellido.value,
    segundoApellido: segundoApellido.value,
    fechaNacimiento: fechaNacimiento.value,
    porcentaje: parseFloat(porcentaje.value),
    poliza: { clave: parseInt(clavePoliza.value) }
  };
}

// CREAR
async function crear(){
  const res = await fetch(base,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(obtenerDatos())
  });
  const data = await res.json();
  beneficiarioId.value = data.id;
  mostrar(formatBeneficiario(data));
}

// EDITAR
async function editar(){
  const id = beneficiarioId.value;
  if(!id){ mostrar("Selecciona beneficiario"); return; }
  const res = await fetch(base+"/"+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(obtenerDatos())
  });
  const data = await res.json();
  mostrar(formatBeneficiario(data));
}

// BUSCAR POR NOMBRE
async function buscarPorNombre(){
  const nombre = buscarNombre.value.trim();
  const a1 = buscarApellido1.value.trim();
  const a2 = buscarApellido2.value.trim();
  if(!nombre || !a1){ mostrar("Debes poner al menos nombre y primer apellido"); return; }

  const url = new URL(base+"/buscar", window.location.origin);
  url.searchParams.append("nombres", nombre);
  url.searchParams.append("primerApellido", a1);
  if(a2) url.searchParams.append("segundoApellido", a2);

  const res = await fetch(url);
  if(!res.ok){ mostrar("Beneficiario no encontrado"); return; }

  const data = await res.json();
  cargarFormulario(data);

  mostrar(formatBeneficiario(data));
}

// BORRAR
async function borrar(){
  const id = beneficiarioId.value;
  if(!id){ mostrar("Selecciona beneficiario"); return; }
  await fetch(base+"/"+id,{method:'DELETE'});
  mostrar("Beneficiario eliminado");
}

// CARGAR FORMULARIO
function cargarFormulario(data){
  beneficiarioId.value = data.id;
  nombres.value = data.nombres;
  primerApellido.value = data.primerApellido;
  segundoApellido.value = data.segundoApellido;
  fechaNacimiento.value = data.fechaNacimiento;
  porcentaje.value = data.porcentaje;
  if(data.poliza){
    if(typeof data.poliza === 'number'){
      clavePoliza.value = data.poliza;
    } else {
      clavePoliza.value = data.poliza?.clave || '';
    }
  } else { clavePoliza.value = ''; }
}

// FORMATEAR BENEFICIARIO
function formatBeneficiario(data){
  const polizaClave = (typeof data.poliza === 'number') ? data.poliza : data.poliza?.clave || 'No asignada';
  return `BENEFICIARIO ENCONTRADO\n\nNombre: ${data.nombres} ${data.primerApellido} ${data.segundoApellido || ''}\nID: ${data.id}\nPorcentaje: ${data.porcentaje}%\nClave de póliza: ${polizaClave}`;
}
</script>

</body>
</html>
