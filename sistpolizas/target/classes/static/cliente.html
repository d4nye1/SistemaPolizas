<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>Registro de Cliente | Sistema de Pólizas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-3xl bg-white/95 rounded-2xl shadow-2xl p-8">

  <!-- CABECERA -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">Gestión de Clientes</h1>
      <p class="text-sm text-slate-500">Alta, edición y consulta de clientes</p>
    </div>
    <button onclick="window.location.href='index.html'"
      class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-900 transition">
      Menú principal
    </button>
  </div>

  <!-- FORMULARIO CLIENTE -->
  <div class="space-y-6">

    <div>
      <h3 class="text-lg font-semibold text-slate-700 mb-3">Crear / Actualizar cliente</h3>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">CURP</label>
          <input id="curp" placeholder="18 caracteres"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Fecha de nacimiento</label>
          <input id="fechaNacimiento" placeholder="1990-04-25"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Nombres</label>
          <input id="nombres" placeholder="Nombre(s)"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Primer apellido</label>
          <input id="primerApellido" placeholder="Apellido paterno"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Segundo apellido</label>
          <input id="segundoApellido" placeholder="Opcional"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none" />
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Dirección</label>
          <input id="direccion" placeholder="Calle, número, colonia"
            class="w-full rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none" />
        </div>
      </div>

      <div class="flex justify-between pt-4">
        <button id="btnCrear"
          class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-semibold transition">
          Crear
        </button>

        <button id="btnActualizar"
          class="px-6 py-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold transition">
          Actualizar
        </button>
      </div>
    </div>

    <!-- OPERACIONES RÁPIDAS -->
    <div>
      <h3 class="text-lg font-semibold text-slate-700 mb-3">Operaciones rápidas</h3>
      <div class="flex flex-col md:flex-row gap-4">
        <input id="curpBuscar" placeholder="CURP a buscar"
          class="flex-1 rounded-xl border border-slate-300 p-3 focus:ring-4 focus:ring-slate-300 focus:outline-none" />

        <button id="btnBuscar"
          class="px-6 py-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-semibold transition">
          Buscar
        </button>

        <button id="btnBorrar"
          class="px-6 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-semibold transition">
          Borrar
        </button>
      </div>
    </div>

    <!-- RESULTADO -->
    <div>
      <h3 class="text-lg font-semibold text-slate-700 mb-3">Resultado</h3>
      <pre id="output" class="bg-slate-100 p-4 rounded-xl overflow-auto text-sm">Aquí verás la respuesta...</pre>
    </div>

  </div>
</div>

<script>
const base = '/api/clientes';

function show(text) {
  document.getElementById('output').textContent = text;
}

async function crear() {
  const data = readForm();
  const res = await fetch(base, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  const body = await readResponse(res);
  show(JSON.stringify(body, null, 2));
}

async function actualizar() {
  const data = readForm();
  const curp = data.curp;
  const res = await fetch(base + '/' + encodeURIComponent(curp), {
    method: 'PUT',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  const body = await readResponse(res);
  show(JSON.stringify(body, null, 2));
}

async function buscar() {
  const curp = document.getElementById('curpBuscar').value.trim();
  if (!curp) { show('Ingresa una CURP'); return; }

  const res = await fetch(base + '/' + encodeURIComponent(curp));
  const body = await readResponse(res);

  if (!res.ok) {
    show("Cliente no encontrado");
    return;
  }

  fillForm(body);

  let salida = `CLIENTE ENCONTRADO\n\n`;
  salida += `Nombre: ${body.nombres} ${body.primerApellido} ${body.segundoApellido || ''}\n`;
  salida += `CURP: ${body.curp}\n\n`;

  if (body.polizas && body.polizas.length > 0) {
    salida += "PÓLIZAS ASOCIADAS:\n";
    body.polizas.forEach(p => {
      salida += `- Clave: ${p.clave} | Tipo: ${p.tipo} | Monto: $${p.monto}\n`;
    });
  } else {
    salida += "Este cliente no tiene pólizas registradas.";
  }

  show(salida);
}

async function borrar() {
  const curp = document.getElementById('curpBuscar').value.trim();
  if (!curp) { show('Ingresa CURP'); return; }
  await fetch(base + '/' + encodeURIComponent(curp), { method: 'DELETE' });
  show("Cliente eliminado correctamente");
}

function readForm() {
  return {
    curp: document.getElementById('curp').value.trim(),
    nombres: document.getElementById('nombres').value.trim(),
    primerApellido: document.getElementById('primerApellido').value.trim(),
    segundoApellido: document.getElementById('segundoApellido').value.trim() || null,
    direccion: document.getElementById('direccion').value.trim(),
    fechaNacimiento: document.getElementById('fechaNacimiento').value.trim()
  };
}

function fillForm(data) {
  if (!data) return;
  document.getElementById('curp').value = data.curp || '';
  document.getElementById('nombres').value = data.nombres || '';
  document.getElementById('primerApellido').value = data.primerApellido || '';
  document.getElementById('segundoApellido').value = data.segundoApellido || '';
  document.getElementById('direccion').value = data.direccion || '';
  document.getElementById('fechaNacimiento').value = data.fechaNacimiento || '';
}

async function readResponse(res) {
  let text = await res.text();
  try { return JSON.parse(text); } catch(e) { return text; }
}

document.getElementById('btnCrear').addEventListener('click', crear);
document.getElementById('btnActualizar').addEventListener('click', actualizar);
document.getElementById('btnBuscar').addEventListener('click', buscar);
document.getElementById('btnBorrar').addEventListener('click', borrar);
</script>

</body>
</html>
